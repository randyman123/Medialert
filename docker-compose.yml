version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: medialert-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: medialert
      MYSQL_USER: medialert_user
      MYSQL_PASSWORD: medialert_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
