services:
  mysql:
    image: mysql:8.0
    container_name: medialert-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: medialert
      MYSQL_USER: medialert_user
      MYSQL_PASSWORD: medialert_pass
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  localstack:
    image: localstack/localstack:3.8.1
    container_name: medialert-localstack
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  localstack_data:
